<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zahlen Prüfer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eeeeee;
            text-align: center;
            padding-top: 100px;
        }

        .box {
            background: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px #aaaaaa;
        }

        input {
            width: 200px;
            padding: 10px;
            font-size: 18px;
        }

        button {
            margin-top: 15px;
            padding: 10px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        #ergebnis {
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box" id="box">

        <h1>Zahlen Prüfer</h1>

        <p>
            Gib eine Zahl ein:
        </p>

        <input
            type="number"
            id="zahl"
            placeholder="Zum Beispiel 42"
        >

        <br>

        <button onclick="pruefen()">
            Prüfen
        </button>

        <div id="ergebnis">
            Noch keine Zahl geprüft.
        </div>

    </div>


    <script>

        function pruefen() {

            // Zahl aus dem Eingabefeld holen
            let zahl =
                document.getElementById("zahl").value;


            // Ergebnis-Feld holen
            let ergebnis =
                document.getElementById("ergebnis");


            // Box holen
            let box =
                document.getElementById("box");


            // Prüfen, ob überhaupt etwas eingegeben wurde
            if (zahl === "") {

                ergebnis.innerText =
                    "Bitte gib zuerst eine Zahl ein!";

                box.style.backgroundColor =
                    "#ffcccc";

                return;
            }


            // Text in echte Zahl umwandeln
            zahl = Number(zahl);


            // Gerade Zahlen haben keinen Rest
            // wenn man sie durch 2 teilt
            if (zahl % 2 === 0) {

                ergebnis.innerText =
                    zahl + " ist gerade!";

                box.style.backgroundColor =
                    "#ccffcc";

            } else {

                ergebnis.innerText =
                    zahl + " ist ungerade!";

                box.style.backgroundColor =
                    "#ffffcc";
            }

        }

    </script>

</body>
</html>
